version: 1
rules:
- rule_id: R01
  risk_type: 利率-基准不明
  category: 利率
  compliant_text: 执行利率为全国银行间同业拆借中心公布的一年期贷款市场报价利率加捌拾个基点，重定价日为每年一月一日，加减点数在合同期内保持不变。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R02
  risk_type: 利率-罚息超限
  category: 利率
  compliant_text: 罚息利率为合同执行利率上浮百分之五十，罚息、复利与利息合计不超过法律及司法解释规定的上限。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R03
  risk_type: 利率-利息预扣
  category: 利率
  compliant_text: 利息自实际放款日起按季结息，出借人不得在放款时预扣任何利息或费用，实际到账金额应与合同本金一致。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R04
  risk_type: 利率-复利不明
  category: 利率
  compliant_text: 对借款人未按期支付的利息，按罚息利率计收复利，复利以未付利息为基数，不计入本金，按季结息。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R05
  risk_type: 利率-单方调息
  category: 利率
  compliant_text: 执行利率按重定价日对应的贷款市场报价利率变动同向调整，出借人应于调整前五个工作日书面通知借款人。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R06
  risk_type: 利率-计息天数矛盾
  category: 利率
  compliant_text: 日利率按年利率除以三百六十五折算，计息天数按实际天数计算，全合同仅适用一种计息口径。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R07
  risk_type: 利率-重定价缺失
  category: 利率
  compliant_text: 重定价日为每年一月一日，重定价时按当日同期限贷款市场报价利率加原加减点数确定新的执行利率。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R08
  risk_type: 利率-费用未折算
  category: 利率
  compliant_text: 本合同项下不收取账户管理费；如发生其他费用，出借人应按年化口径折算并计入综合融资成本向借款人披露。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R09
  risk_type: 利率-提前还款违约金
  category: 利率
  compliant_text: 借款人提前还款的，按提前还款金额的百分之一支付补偿金，补偿金不超过提前还款金额对应的三个月利息。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R10
  risk_type: 利率-起息日不一致
  category: 利率
  compliant_text: 起息日为出借人将借款本金划付至借款人账户之日，与放款日一致。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R11
  risk_type: 担保-保证方式不明
  category: 担保
  compliant_text: 保证人自愿为该笔借款提供连带责任保证，出借人有权直接要求保证人在保证范围内承担保证责任。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R12
  risk_type: 担保-担保范围不足
  category: 担保
  compliant_text: 担保范围包括借款本金、利息、罚息、复利、违约金、损害赔偿金以及出借人实现债权的费用。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R13
  risk_type: 担保-保证期间过短
  category: 担保
  compliant_text: 保证期间为主债务履行期限届满之日起三年，期间内出借人有权要求保证人承担保证责任。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R14
  risk_type: 担保-抵押未登记
  category: 担保
  compliant_text: 抵押人应于本合同签订之日起十五个工作日内配合办理抵押登记，登记完成后方可放款，登记费用由抵押人承担。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R15
  risk_type: 担保-抵押率超限
  category: 担保
  compliant_text: 抵押物评估价值为四千万元，担保债权本息合计不超过二千八百万元，抵押率不超过百分之七十，出借人可每年对抵押物价值重估一次。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R16
  risk_type: 担保-最高额不明
  category: 担保
  compliant_text: 本最高额担保所担保的最高债权额为人民币二千万元，包括本金、利息、罚息、复利及实现债权的费用。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R17
  risk_type: 担保-质物交付不明
  category: 担保
  compliant_text: 出质人应于本合同签订之日起五个工作日内将质物权利凭证交付出借人保管，保管期间质物毁损灭失的风险由出质人承担。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R18
  risk_type: 担保-配偶同意缺位
  category: 担保
  compliant_text: 保证人配偶应签署同意担保声明书，确认知悉并同意保证人以夫妻共同财产承担保证责任。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R19
  risk_type: 担保-保证人资格瑕疵
  category: 担保
  compliant_text: 保证人为依法设立并有效存续的企业法人，具备代为清偿债务的能力，且不属于法律禁止担任保证人的主体。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R20
  risk_type: 担保-自行处置担保物
  category: 担保
  compliant_text: 债务履行期限届满未获清偿的，出借人应与抵押人协议以抵押物折价或以拍卖、变卖所得价款优先受偿；协议不成的，可请求人民法院拍卖、变卖抵押物。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R21
  risk_type: 违约-情形过宽
  category: 违约
  compliant_text: 借款人发生下列情形之一，且经出借人书面催告后十个工作日内未予纠正的，构成违约。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R22
  risk_type: 违约-加速到期随意
  category: 违约
  compliant_text: 发生本合同约定的违约事件且借款人未在催告期内纠正的，出借人有权书面宣布借款提前到期，并说明所依据的违约事实。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R23
  risk_type: 违约-违约金过高
  category: 违约
  compliant_text: 借款人构成违约的，应赔偿出借人因此产生的实际损失，包括但不限于诉讼费、律师费、保全费及差旅费。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R24
  risk_type: 违约-违约金重复计算
  category: 违约
  compliant_text: 借款人逾期的，出借人有权按罚息利率计收罚息；罚息已覆盖资金占用损失的，不再重复计收违约金。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R25
  risk_type: 违约-无宽限期
  category: 违约
  compliant_text: 借款人未在还款日足额还款的，出借人应于次日发出书面催告，借款人自催告送达之日起五个工作日内补足的，不视为违约。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R26
  risk_type: 违约-交叉违约无限定
  category: 违约
  compliant_text: 借款人对其他金融机构的债务发生逾期且单笔金额超过人民币一百万元的，构成本合同项下的违约事件。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R27
  risk_type: 违约-实现债权费用缺失
  category: 违约
  compliant_text: 出借人因实现债权支出的诉讼费、律师费、保全费、公证费及差旅费由借款人承担。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R28
  risk_type: 违约-陈述保证过重
  category: 违约
  compliant_text: 借款人保证其提交的资料在提供之日真实、准确、完整；资料发生重大变化的，应于十个工作日内书面告知出借人。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R29
  risk_type: 违约-不可抗力缺失
  category: 违约
  compliant_text: 因不可抗力致使合同全部或部分不能履行的，受影响方应在事件发生后十五日内提供证明，双方协商调整还款安排，互不承担违约责任。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R30
  risk_type: 违约-单方变更
  category: 违约
  compliant_text: 本合同的任何变更应经双方协商一致并签署书面补充协议；未经借款人书面同意的变更对借款人不发生效力。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R31
  risk_type: 合规-格式条款提示
  category: 合规
  compliant_text: 本合同中免除或减轻出借人责任、加重借款人责任、限制借款人主要权利的条款以加粗字体标示，借款人已逐条阅读并签字确认。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R32
  risk_type: 合规-无效格式条款
  category: 合规
  compliant_text: 出借人依本合同约定行使权利时，应书面通知借款人并说明依据；借款人对出借人主张有异议的，有权提出异议并依法寻求救济。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R33
  risk_type: 合规-争议解决不明
  category: 合规
  compliant_text: 因本合同发生的争议，双方应协商解决；协商不成的，向出借人所在地有管辖权的人民法院提起诉讼。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R34
  risk_type: 合规-管辖无连接点
  category: 合规
  compliant_text: 因本合同发生的争议，由合同签订地或出借人住所地有管辖权的人民法院管辖。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R35
  risk_type: 合规-送达条款缺失
  category: 合规
  compliant_text: 双方确认合同首部载明的地址、电子邮箱与手机号码为有效送达地址；一方变更送达地址的，应于变更之日起五个工作日内书面通知对方，未通知的，按原地址送达即视为有效送达。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R36
  risk_type: 合规-个人信息
  category: 合规
  compliant_text: 出借人处理借款人个人信息应遵循合法、正当、必要原则，并取得借款人的单独同意；未经单独同意不得向第三方提供，法律法规另有规定的除外。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R37
  risk_type: 合规-数据出境
  category: 合规
  compliant_text: 出借人不得将借款人信息传输至境外；确需向境外提供的，应履行法定程序并取得借款人单独同意。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R38
  risk_type: 合规-电子签名效力
  category: 合规
  compliant_text: 本合同采用可靠电子签名订立的，与书面形式具有同等法律效力；出借人应向借款人提供可查阅、可下载的合同文本及签署时间戳记录。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R39
  risk_type: 合规-综合成本未披露
  category: 合规
  compliant_text: 出借人应以年化形式向借款人披露综合融资成本，包括利息及各项费用，并在合同中列明费用项目、金额与收取方式。
  note: 该表述为合规范式；命中此表述时不得报告为风险
- rule_id: R40
  risk_type: 合规-解除后清算缺失
  category: 合规
  compliant_text: 本合同解除后，借款人应立即清偿未还本金及自起息日至清偿日的利息；已收取的费用按实际用款期限结算，多收部分予以退还，清偿顺序依次为实现债权费用、利息、本金。
  note: 该表述为合规范式；命中此表述时不得报告为风险
